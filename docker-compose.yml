services:

  nginx:
    image: ghcr.io/ronasit/php-nginx-dev:8.5
    working_dir: /app
    command: >
      bash -c "chmod +x ./docker/entrypoint.sh && ./docker/entrypoint.sh && cd /opt/docker && supervisord"
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./:/app
    depends_on:
      pgsql:
        condition: service_healthy
      pgsql_test:
        condition: service_started
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      WEB_DOCUMENT_INDEX: index.php
      REDIS_PORT: "6379"
      XDEBUG_MAX_NESTING_LEVEL: 250
      XDEBUG_PROFILER_ENABLE: 0
      XDEBUG_START_WITH_REQUEST: 1
      XDEBUG_DISCOVER_CLIENT_HOST: 0
      XDEBUG_CLIENT_PORT: 9000
      XDEBUG_CLIENT_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pgsql:
    image: postgres:18.3
    ports:
      - 5432:5432
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - pgsql_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -h localhost -U postgres
      interval: 2s
      timeout: 3s
      retries: 15

  pgsql_test:
    image: postgres:18.3
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    ports:
      - 5433:5432
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    tmpfs:
      - /var/lib/postgresql

  redis:
    image: redis:8.6
    ports:
      - 6379:6379

  php:
    image: webdevops/php:8.5-alpine
    working_dir: /app
    volumes:
      - ./:/app

volumes:
  pgsql_data:
